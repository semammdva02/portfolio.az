<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universitet İdarəetmə Sistemi — Səma Məmmədova</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="universitet.css">
</head>
<body>
<header><div class="w"><a class="bk" href="index.html" target="_blank" rel="noopener">← Portfolioya qayıt</a><h1 style="margin-top:8px">Universitet İdarəetmə Sistemi</h1><p>Tələbə qeydiyyatı, qiymət cədvəli, davamiyyət və hesabat. Nümunə məlumatlarla demo.</p></div></header>
<div class="w">
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</div>
<script>
var K="uis-sema",C=["Riyaziyyat","Proqramlaşdırma","Verilənlər bazası"],TOTAL=30;
var D={n:6,s:[{id:1,a:"Aysel Hüseynova",g:"IT-21",m:[85,92,78],x:2},{id:2,a:"Elvin Quliyev",g:"IT-21",m:[64,71,58],x:6},{id:3,a:"Nigar Əliyeva",g:"IT-22",m:[95,89,97],x:0},{id:4,a:"Rəşad Cəfərov",g:"IT-22",m:[45,52,40],x:12},{id:5,a:"Leyla Nəsirova",g:"IT-21",m:[73,80,69],x:3}]};
try{var t=JSON.parse(localStorage.getItem(K));if(t&&t.s)D=t}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var T=[["st","Tələbələr"],["gr","Qiymətlər"],["at","Davamiyyət"],["rp","Hesabat"]],cur="st",V=document.getElementById("v");
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function avg(s){return s.m.reduce(function(a,b){return a+b},0)/s.m.length}
function att(s){return Math.round((TOTAL-s.x)/TOTAL*100)}
function ok(s){return avg(s)>=51&&att(s)>=75}
function tabs(){document.getElementById("tabs").innerHTML=T.map(function(x){return '<button type="button" data-t="'+x[0]+'" class="'+(x[0]===cur?"on":"")+'">'+x[1]+"</button>"}).join("")}
function num(v,mx){v=parseInt(v,10);return isNaN(v)?0:Math.max(0,Math.min(mx,v))}
function render(){tabs();var h="";
if(cur==="st"){h='<div class="card"><h2>Yeni tələbə</h2><div class="row"><input id="na" placeholder="Ad və soyad" aria-label="Ad və soyad"><input id="ng" placeholder="Qrup (məs. IT-23)" aria-label="Qrup"><button class="b" id="add" type="button">Qeydiyyat et</button></div></div><div class="card"><h2>Tələbələr ('+D.s.length+')</h2><div class="tw"><table><tr><th>Ad, soyad</th><th>Qrup</th><th></th></tr>'+D.s.map(function(s){return "<tr><td>"+esc(s.a)+"</td><td>"+esc(s.g)+'</td><td><button class="dl" data-d="'+s.id+'" type="button">Sil</button></td></tr>'}).join("")+"</table></div></div>"}
if(cur==="gr"){h='<div class="card"><h2>Qiymət cədvəli</h2><p class="hint">Qiymət 0-100 arası yazılır, dəyişiklik avtomatik saxlanılır.</p><div class="tw"><table><tr><th>Tələbə</th>'+C.map(function(c){return "<th>"+c+"</th>"}).join("")+"<th>Orta</th></tr>"+D.s.map(function(s){return "<tr><td>"+esc(s.a)+"</td>"+s.m.map(function(m,i){return '<td><input class="n" type="number" min="0" max="100" value="'+m+'" data-g="'+s.id+"-"+i+'" aria-label="'+esc(s.a)+" "+C[i]+'"></td>'}).join("")+"<td><b>"+avg(s).toFixed(1)+"</b></td></tr>"}).join("")+"</table></div></div>"}
if(cur==="at"){h='<div class="card"><h2>Davamiyyət</h2><p class="hint">Cəmi '+TOTAL+' dərs. Buraxılan dərs sayını yazın, 75%-dən aşağı olarsa xəbərdarlıq görünür.</p><div class="tw"><table><tr><th>Tələbə</th><th>Buraxılan dərs</th><th>Davamiyyət</th></tr>'+D.s.map(function(s){var p=att(s);return "<tr><td>"+esc(s.a)+'</td><td><input class="n" type="number" min="0" max="'+TOTAL+'" value="'+s.x+'" data-x="'+s.id+'" aria-label="Buraxılan dərs '+esc(s.a)+'"></td><td class="'+(p>=75?"ok":"no")+'">'+p+"%</td></tr>"}).join("")+"</table></div></div>"}
if(cur==="rp"){var n=D.s.length,a=n?D.s.reduce(function(q,s){return q+avg(s)},0)/n:0,p=D.s.filter(ok).length,best=D.s.slice().sort(function(x,y){return avg(y)-avg(x)})[0];
h='<div class="kp"><div><b>'+n+"</b><span>Tələbə sayı</span></div><div><b>"+a.toFixed(1)+"</b><span>Ümumi orta bal</span></div><div><b>"+p+" / "+n+"</b><span>Keçən tələbə</span></div><div><b>"+(best?esc(best.a.split(" ")[0]):"-")+"</b><span>Ən yüksək orta bal</span></div></div>";
h+='<div class="card"><h2>Hesabat</h2><p class="hint">Keçid şərti: orta bal ən azı 51 və davamiyyət ən azı 75%.</p><div class="tw"><table><tr><th>Tələbə</th><th>Qrup</th><th>Orta bal</th><th>Davamiyyət</th><th>Nəticə</th></tr>'+D.s.map(function(s){return "<tr><td>"+esc(s.a)+"</td><td>"+esc(s.g)+"</td><td>"+avg(s).toFixed(1)+"</td><td>"+att(s)+'%</td><td class="'+(ok(s)?"ok":"no")+'">'+(ok(s)?"Keçdi":"Keçmədi")+"</td></tr>"}).join("")+"</table></div></div>"}
V.innerHTML=h}
document.getElementById("tabs").onclick=function(e){if(e.target.dataset.t){cur=e.target.dataset.t;render()}};
V.onclick=function(e){var t=e.target;
if(t.id==="add"){var a=document.getElementById("na").value.trim(),g=document.getElementById("ng").value.trim();if(!a)return;D.s.push({id:++D.n+10,a:a,g:g||"-",m:[0,0,0],x:0});save();render()}
if(t.dataset.d){D.s=D.s.filter(function(s){return String(s.id)!==t.dataset.d});save();render()}};
V.onchange=function(e){var t=e.target,s;
if(t.dataset.g){var p=t.dataset.g.split("-");s=D.s.filter(function(x){return String(x.id)===p[0]})[0];if(s){s.m[+p[1]]=num(t.value,100);save();render()}}
if(t.dataset.x){s=D.s.filter(function(x){return String(x.id)===t.dataset.x})[0];if(s){s.x=num(t.value,TOTAL);save();render()}}};
render();
</script>
</body>
</html>
